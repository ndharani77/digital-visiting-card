<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title description">
  <title id="title">All SheetPilot fields in one sheet</title>
  <desc id="description">A single cards sheet with required, generated, optional, and preview fields.</desc>
  <defs>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#102c57"/>
      <stop offset="1" stop-color="#07518a"/>
    </linearGradient>
    <style>
      .font { font-family: Arial, Helvetica, sans-serif; }
      .title { font-size: 34px; font-weight: 700; fill: #fff; }
      .subtitle { font-size: 16px; fill: #dcecff; }
      .section { font-size: 20px; font-weight: 700; fill: #102c57; }
      .label { font-size: 14px; font-weight: 700; fill: #334155; }
      .field { font-size: 15px; font-weight: 700; fill: #12355b; }
      .note { font-size: 14px; fill: #475569; }
      .small { font-size: 12px; fill: #64748b; }
      .code { font-size: 14px; font-family: Consolas, monospace; fill: #e2e8f0; }
    </style>
  </defs>
  <rect width="1200" height="940" fill="#f3f6fa"/>
  <rect x="36" y="30" width="1128" height="126" rx="22" fill="url(#header)"/>
  <text class="font title" x="72" y="83">SheetPilot: one sheet only</text>
  <text class="font subtitle" x="72" y="117">Use one row per card in a single Cards sheet</text>

  <rect x="36" y="180" width="1128" height="548" rx="20" fill="#fff" stroke="#dbe3ee" stroke-width="2"/>
  <text class="font section" x="68" y="222">CARDS SHEET</text>
  <text class="font small" x="1092" y="221" text-anchor="end">one row per card</text>

  <rect x="68" y="245" width="1064" height="132" rx="14" fill="#eff6ff"/>
  <text class="font label" x="90" y="273">REQUIRED CARD DETAILS</text>
  <g>
    <rect x="90" y="293" width="158" height="48" rx="10" fill="#dbeafe"/><text class="font field" x="169" y="323" text-anchor="middle">fullName</text>
    <rect x="261" y="293" width="158" height="48" rx="10" fill="#dbeafe"/><text class="font field" x="340" y="323" text-anchor="middle">designation</text>
    <rect x="432" y="293" width="158" height="48" rx="10" fill="#dbeafe"/><text class="font field" x="511" y="323" text-anchor="middle">company</text>
    <rect x="603" y="293" width="158" height="48" rx="10" fill="#dbeafe"/><text class="font field" x="682" y="323" text-anchor="middle">countryCode</text>
    <rect x="774" y="293" width="158" height="48" rx="10" fill="#dbeafe"/><text class="font field" x="853" y="323" text-anchor="middle">mobile</text>
    <rect x="945" y="293" width="158" height="48" rx="10" fill="#dbeafe"/><text class="font field" x="1024" y="323" text-anchor="middle">email</text>
  </g>

  <text class="font label" x="90" y="414">GENERATED BY THE APP</text>
  <g>
    <rect x="90" y="433" width="190" height="45" rx="9" fill="#ecfdf5"/><text class="font field" x="185" y="461" text-anchor="middle">id (unique)</text>
    <rect x="292" y="433" width="190" height="45" rx="9" fill="#ecfdf5"/><text class="font field" x="387" y="461" text-anchor="middle">isActive</text>
    <rect x="504" y="433" width="190" height="45" rx="9" fill="#ecfdf5"/><text class="font field" x="599" y="461" text-anchor="middle">createdAt</text>
  </g>

  <text class="font label" x="90" y="519">OPTIONAL CARD DETAILS</text>
  <text class="font note" x="90" y="548">address · website · linkedin · linkedinName · logoData</text>

  <rect x="68" y="570" width="1064" height="64" rx="12" fill="#fff7ed" stroke="#fed7aa"/>
  <text class="font field" x="90" y="596">preview</text>
  <text class="font note" x="174" y="596">Per-card preview override (JSON); leave empty to use shared defaultPreview (JSON).</text>
  <text class="font small" x="90" y="619">company, website, logoData, and defaultPreview are shared values, repeated on each card row.</text>

  <text class="font label" x="68" y="675">COPY-READY HEADERS</text>
  <rect x="68" y="692" width="1064" height="104" rx="12" fill="#102c57"/>
  <text class="code" x="90" y="727">id, fullName, designation, company, countryCode, mobile, email, address, website, linkedin,</text>
  <text class="code" x="90" y="753">linkedinName, logoData, isActive, createdAt, preview, defaultPreview</text>

  <rect x="36" y="820" width="1128" height="82" rx="18" fill="#fff" stroke="#dbe3ee" stroke-width="2"/>
  <text class="font note" x="68" y="855">Keep backgroundColor and accentColor out of the sheet; all cards use the same app-wide colors.</text>
  <text class="font small" x="68" y="880">For one-sheet storage, repeat shared company values in each card row. Store preview fields as JSON/long text.</text>
</svg>
